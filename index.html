<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>호수의 총알 피하기</title>
  <style>
    :root{
      --bg:#06101f; --panel:#0b1730; --line:rgba(99,221,255,.28);
      --cyan:#6ef3ff; --mint:#78f4d8; --text:#eef8ff; --muted:#91a4bf;
      --danger:#ff4f91; --yellow:#ffe96a;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0; width:100%; height:100%; overflow:hidden;
      font-family:Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(44,132,255,.15), transparent 34%),
        radial-gradient(circle at 86% 82%, rgba(96,255,213,.08), transparent 32%),
        var(--bg);
      color:var(--text);
      touch-action:none;
    }
    body::before{
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.2;
      background-image:
        linear-gradient(rgba(100,170,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100,170,255,.06) 1px, transparent 1px);
      background-size:32px 32px;
    }
    #game{
      position:relative; width:100%; height:100%;
      border:1px solid rgba(110,243,255,.18);
      overflow:hidden;
    }
    canvas{position:absolute; inset:0; width:100%; height:100%}
    .topbar{
      position:absolute; top:0; left:0; right:0; z-index:5;
      display:flex; justify-content:space-between; align-items:flex-start;
      padding:18px 24px; pointer-events:none;
    }
    .brand{
      font-size:14px; letter-spacing:.22em; font-weight:900; color:var(--cyan);
      text-shadow:0 0 16px rgba(110,243,255,.5);
    }
    .stats{display:flex; gap:10px}
    .stat{
      min-width:92px; padding:12px 16px; text-align:center;
      background:rgba(7,18,39,.72); border:1px solid rgba(255,255,255,.06);
      border-radius:16px; backdrop-filter:blur(10px);
    }
    .stat span{display:block; color:var(--muted); font-size:10px; letter-spacing:.18em}
    .stat strong{display:block; margin-top:5px; font-size:18px}
    .overlay{
      position:absolute; inset:0; z-index:10; display:grid; place-items:center;
      background:rgba(3,9,23,.35); backdrop-filter:blur(2px);
    }
    .overlay.hidden{display:none}
    .card{
      width:min(560px, calc(100vw - 32px));
      padding:34px 32px;
      border-radius:24px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(12,28,60,.96), rgba(5,13,31,.97));
      box-shadow:0 30px 80px rgba(0,0,0,.45), 0 0 40px rgba(77,216,255,.08);
      text-align:center;
    }
    .eyebrow{
      color:var(--cyan); font-size:12px; font-weight:900; letter-spacing:.28em;
      margin-bottom:10px;
    }
    h1{
      margin:0; font-size:clamp(52px, 8vw, 84px); line-height:.88;
      letter-spacing:-.06em;
    }
    .subtitle{
      margin:24px auto 0; max-width:440px; color:var(--muted);
      line-height:1.65; font-size:14px;
    }
    .controls{
      display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin:24px 0;
    }
    .pill{
      padding:8px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04); font-size:13px;
    }
    label{
      display:block; text-align:left; width:min(330px,100%); margin:0 auto 7px;
      color:var(--muted); font-size:11px; letter-spacing:.14em;
    }
    input{
      width:min(330px,100%); height:46px; padding:0 15px;
      border:1px solid rgba(110,243,255,.28); border-radius:14px;
      background:rgba(255,255,255,.05); color:var(--text); outline:none;
      font-size:15px; text-align:center;
    }
    input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(110,243,255,.08)}
    button{
      margin-top:16px; border:0; border-radius:14px; padding:14px 24px;
      background:linear-gradient(135deg,var(--cyan),var(--mint));
      color:#062135; font-weight:900; font-size:15px; cursor:pointer;
      box-shadow:0 12px 30px rgba(87,240,225,.22);
    }
    button:hover{transform:translateY(-1px)}
    .small{margin-top:20px; color:var(--muted); font-size:12px}
    .result-score{font-size:34px; font-weight:900; color:var(--yellow); margin-top:18px}
    .result-detail{margin-top:14px; color:var(--muted); font-size:15px; line-height:1.7}
    .warning{
      margin-top:12px; min-height:20px; color:#ff9ab9; font-size:13px; font-weight:700;
    }
    .footer-tip{
      position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
      z-index:4; color:rgba(196,214,239,.45); font-size:12px; pointer-events:none;
    }
    @media(max-width:700px){
      .topbar{padding:12px}
      .brand{font-size:11px}
      .stats{gap:6px}
      .stat{min-width:68px;padding:9px 10px;border-radius:12px}
      .stat strong{font-size:15px}
      .card{padding:28px 22px}
      h1{font-size:58px}
    }
  </style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div class="topbar">
    <div class="brand">HOSU BULLET DODGE</div>
    <div class="stats">
      <div class="stat"><span>SCORE</span><strong id="scoreText">0</strong></div>
      <div class="stat"><span>TIME</span><strong id="timeText">0.0</strong></div>
      <div class="stat"><span>LIFE</span><strong id="lifeText">♥♥♥</strong></div>
    </div>
  </div>

  <div id="startOverlay" class="overlay">
    <div class="card">
      <div class="eyebrow">SURVIVAL ARCADE</div>
      <h1>호수의<br>총알 피하기</h1>
      <p class="subtitle">
        사방에서 날아오는 총알을 피하세요.<br>
        시간이 지날수록 총알의 속도와 수가 빠르게 증가합니다.
      </p>
      <div class="controls">
        <div class="pill">WASD</div><div class="pill">방향키</div>
        <div class="pill">마우스 드래그</div><div class="pill">터치 드래그</div>
        <div class="pill">즉각 반응 이동</div>
      </div>

      <label for="nicknameInput">PLAYER NICKNAME</label>
      <input id="nicknameInput" type="text" maxlength="12" placeholder="닉네임을 입력하세요" autocomplete="off" />
      <div id="warning" class="warning"></div>
      <button id="startBtn">게임 시작</button>
      <div class="small">기록은 저장되지 않으며 이번 도전 결과만 표시됩니다.</div>
    </div>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <div class="card">
      <div class="eyebrow">MISSION FAILED</div>
      <h1 style="font-size:68px">GAME<br>OVER</h1>
      <div id="finalScore" class="result-score">0점</div>
      <div id="finalResult" class="result-detail"></div>
      <button id="retryBtn">다시 도전</button>
    </div>
  </div>

  <div class="footer-tip">WASD / 방향키: 즉시 이동 · 마우스 / 터치: 드래그한 만큼 1:1 이동</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const nicknameInput = document.getElementById('nicknameInput');
  const warning = document.getElementById('warning');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const scoreText = document.getElementById('scoreText');
  const timeText = document.getElementById('timeText');
  const lifeText = document.getElementById('lifeText');
  const finalScore = document.getElementById('finalScore');
  const finalResult = document.getElementById('finalResult');

  let W = 0, H = 0, dpr = 1;
  let running = false, nickname = '', elapsed = 0, score = 0, last = 0;
  let spawnTimer = 0, screenShake = 0;
  const keys = {};
  const bullets = [];
  const particles = [];
  const stars = [];

  const player = {
    x:0, y:0, r:10, speed:480, lives:3,
    invincible:0
  };

  // 마우스/터치는 목표점을 따라가는 방식이 아니라,
  // 사용자가 실제로 드래그한 거리만큼 플레이어를 즉시 이동시킵니다.
  let pointerActive = false;
  let activePointerId = null;
  let pointerLastX = 0;
  let pointerLastY = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);

    if (!stars.length) {
      for (let i=0;i<120;i++) {
        stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,a:Math.random()*.7+.15});
      }
    }
  }

  function resetGame(){
    bullets.length = 0;
    particles.length = 0;
    elapsed = 0;
    score = 0;
    spawnTimer = .6;
    player.x = W/2;
    player.y = H/2;
    player.lives = 3;
    player.invincible = 1.1;
    pointerActive = false;
    activePointerId = null;
    updateHUD();
  }

  function startGame(){
    const value = nicknameInput.value.trim();
    if (!value) {
      warning.textContent = '닉네임을 입력해주세요.';
      nicknameInput.focus();
      return;
    }
    warning.textContent = '';
    nickname = value;
    resetGame();
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    const finalPoints = Math.floor(score);
    const survival = elapsed.toFixed(1);
    finalScore.textContent = finalPoints.toLocaleString() + '점';
    finalResult.innerHTML =
      `<strong style="color:#eef8ff">${escapeHtml(nickname)}</strong><br>` +
      `기록 점수 ${finalPoints.toLocaleString()}점 · 생존 ${survival}초`;
    gameOverOverlay.classList.remove('hidden');
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }

  function updateHUD(){
    scoreText.textContent = Math.floor(score).toLocaleString();
    timeText.textContent = elapsed.toFixed(1);
    lifeText.textContent = '♥'.repeat(player.lives) || '—';
  }

  function spawnBullet(){
    const side = Math.floor(Math.random()*4);
    let x,y;
    const pad = 28;
    if (side===0){x=Math.random()*W;y=-pad}
    else if(side===1){x=W+pad;y=Math.random()*H}
    else if(side===2){x=Math.random()*W;y=H+pad}
    else {x=-pad;y=Math.random()*H}

    const difficulty = 1 + elapsed / 10;
    const angle = Math.atan2(player.y-y, player.x-x) + (Math.random()-.5)*Math.max(.03,.32-elapsed/90);
    const speed = (120 + Math.random()*100) * Math.min(4.8,difficulty);
    const r = 5 + Math.random()*4;

    bullets.push({
      x,y,r,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      hue: Math.random()<.17 ? 190 : 340,
      trail:[]
    });
  }

  function hitPlayer(){
    if (player.invincible>0) return;
    player.lives--;
    player.invincible = 1.25;
    screenShake = 14;

    for(let i=0;i<28;i++){
      particles.push({
        x:player.x,y:player.y,
        vx:(Math.random()-.5)*320,vy:(Math.random()-.5)*320,
        life:.4+Math.random()*.5,max:.9,r:2+Math.random()*4
      });
    }

    if(player.lives<=0) endGame();
  }

  function clampPlayer(){
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(player.r, Math.min(H-player.r, player.y));
  }

  function update(dt){
    elapsed += dt;
    score += dt * (24 + elapsed * 1.35);

    player.invincible = Math.max(0, player.invincible-dt);

    // 키보드: 가속/감속 없이 누르는 즉시 최고 속도로 이동하고, 떼는 즉시 정지합니다.
    let dx=0,dy=0;
    if(keys['arrowleft']||keys['a']) dx--;
    if(keys['arrowright']||keys['d']) dx++;
    if(keys['arrowup']||keys['w']) dy--;
    if(keys['arrowdown']||keys['s']) dy++;

    if(dx!==0 || dy!==0){
      const len=Math.hypot(dx,dy);
      player.x += (dx/len)*player.speed*dt;
      player.y += (dy/len)*player.speed*dt;
      clampPlayer();
    }

    spawnTimer -= dt;
    const interval = Math.max(.05, .64 - elapsed * .018);
    if(spawnTimer<=0){
      const waveCount = Math.min(8, 1 + Math.floor(elapsed/10));
      for(let i=0;i<waveCount;i++) spawnBullet();

      if(elapsed>22 && Math.random()<Math.min(.8,elapsed/78)){
        const extra = Math.min(5,1+Math.floor((elapsed-22)/16));
        for(let i=0;i<extra;i++) spawnBullet();
      }
      spawnTimer = interval * (.7 + Math.random()*.4);
    }

    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>7)b.trail.shift();
      b.x+=b.vx*dt;b.y+=b.vy*dt;

      if(b.x<-80||b.x>W+80||b.y<-80||b.y>H+80){bullets.splice(i,1);continue}

      const dist=Math.hypot(b.x-player.x,b.y-player.y);
      if(dist<b.r+player.r*.72){
        bullets.splice(i,1);
        hitPlayer();
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=.97;p.vy*=.97;p.life-=dt;
      if(p.life<=0)particles.splice(i,1);
    }

    screenShake=Math.max(0,screenShake-40*dt);
    updateHUD();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();

    if(screenShake>0){
      ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
    }

    for(const s of stars){
      ctx.globalAlpha=s.a;
      ctx.fillStyle='#dff8ff';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    for(const b of bullets){
      for(let i=0;i<b.trail.length;i++){
        const t=b.trail[i];
        ctx.globalAlpha=(i/b.trail.length)*.2;
        ctx.fillStyle=`hsl(${b.hue} 95% 64%)`;
        ctx.beginPath();ctx.arc(t.x,t.y,b.r*(i/b.trail.length),0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
      const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.7);
      grad.addColorStop(0,'#fff');
      grad.addColorStop(.25,`hsl(${b.hue} 100% 72%)`);
      grad.addColorStop(1,`hsla(${b.hue},100%,55%,0)`);
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.7,0,Math.PI*2);ctx.fill();
    }

    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max);
      ctx.fillStyle='#78f4d8';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    const blink = player.invincible>0 && Math.floor(player.invincible*12)%2===0;
    if(!blink){
      ctx.save();
      ctx.translate(player.x,player.y);
      const glow=ctx.createRadialGradient(0,0,0,0,0,34);
      glow.addColorStop(0,'rgba(110,243,255,.55)');
      glow.addColorStop(1,'rgba(110,243,255,0)');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#eaffff';
      ctx.beginPath();
      ctx.moveTo(0,-15);ctx.lineTo(11,12);ctx.lineTo(0,7);ctx.lineTo(-11,12);
      ctx.closePath();ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  function loop(now){
    if(!running)return;
    const dt=Math.min(.033,(now-last)/1000||0);
    last=now;
    update(dt);
    draw();
    if(running)requestAnimationFrame(loop);
  }

  window.addEventListener('resize',resize);
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k)){
      e.preventDefault();
      keys[k]=true;
    }
  });
  window.addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k)){
      keys[k]=false;
    }
  });
  window.addEventListener('blur',()=>{
    for(const k in keys) keys[k]=false;
    pointerActive=false;
    activePointerId=null;
  });

  canvas.addEventListener('pointerdown',e=>{
    if(!running) return;
    pointerActive=true;
    activePointerId=e.pointerId;
    pointerLastX=e.clientX;
    pointerLastY=e.clientY;
    if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  canvas.addEventListener('pointermove',e=>{
    if(!running || !pointerActive || e.pointerId!==activePointerId) return;

    // 포인터가 움직인 거리와 같은 만큼 즉시 이동 (속도 제한/추적 지연 없음)
    const moveX=e.clientX-pointerLastX;
    const moveY=e.clientY-pointerLastY;
    player.x += moveX;
    player.y += moveY;
    clampPlayer();

    pointerLastX=e.clientX;
    pointerLastY=e.clientY;
    e.preventDefault();
  });

  function releasePointer(e){
    if(e && activePointerId!==null && e.pointerId!==activePointerId) return;
    pointerActive=false;
    activePointerId=null;
  }

  canvas.addEventListener('pointerup',releasePointer);
  canvas.addEventListener('pointercancel',releasePointer);
  canvas.addEventListener('lostpointercapture',releasePointer);

  startBtn.addEventListener('click',startGame);
  retryBtn.addEventListener('click',()=>{
    gameOverOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
    nicknameInput.focus();
  });
  nicknameInput.addEventListener('keydown',e=>{
    if(e.key==='Enter')startGame();
  });

  resize();
  draw();
})();
</script>
</body>
</html>
